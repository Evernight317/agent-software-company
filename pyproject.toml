[project]
name = "agent-software-company"
version = "0.1.0"
description = "LLM multi-agent autonomous software development company"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "chromadb>=0.5",
    "rich>=13.0",
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
asc = "company.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
